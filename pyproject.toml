[project]
name = "huggingfaceinaction"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=0.26.0",
    "datasets>=5.2.0",
    "decord>=0.6.0",
    "eva-decord>=0.6.1",
    "faiss-cpu>=1.16.0",
    "google-search-results>=2.4.2",
    "gpt4all>=2.8.2",
    "gputil>=1.4.0",
    "gradio>=6.32.0",
    "huggingface-hub>=1.33.0",
    "jq>=1.13.0",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.8.3",
    "langflow>=1.13.3",
    "langgraph>=1.2.23",
    "llama-index>=0.14.26",
    "llama-index-embeddings-huggingface>=0.9.0",
    "llama-index-llms-huggingface>=0.9.0",
    "matplotlib>=3.11.2",
    "pandas>=2.3.3",
    "pillow>=13.0.0",
    "protobuf>=7.36.2",
    "python-dotenv>=1.2.4",
    "scikit-image>=0.26.0",
    "sentence-transformers>=6.3.0",
    "sentencepiece>=0.2.3",
    "smolagents>=1.26.0",
    "timm>=1.0.31",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
